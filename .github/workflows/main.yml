name: Build Web Assets and Package APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Build Web Dist
      run: npm run build

    - name: Package Dist to ZIP
      run: |
        cd dist
        zip -r ../nununti-web-build.zip .

    - name: Upload Web Build Asset
      uses: actions/upload-artifact@v4
      with:
        name: nununti-web-dist
        path: nununti-web-build.zip
