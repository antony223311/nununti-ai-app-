name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Dependencies
      run: npm install

    - name: Build Web Project
      run: npm run build

    - name: Create Capacitor Config & Sync
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        # Detect dist or build directory automatically
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.nununti.app",
          "appName": "Nununti",
          "webDir": "$WEB_DIR",
          "bundledWebRuntime": false
        }
        EOF

        npx cap add android
        npx cap copy android

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Build Debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Nununti-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
